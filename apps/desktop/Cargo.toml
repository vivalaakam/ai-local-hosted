[package]
name = "alh-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
futures = "0.3.34"
gpui-kit = "=0.6.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "net"] }
uuid = { version = "1.29.1", features = ["serde"] }

[[bin]]
name = "alh-chat"
path = "src/main.rs"

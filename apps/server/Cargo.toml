[package]
name = "alh-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
alh-core = { version = "0.1.0", path = "../../crates/core" }
alh-providers = { version = "0.1.0", path = "../../crates/providers" }
alh-storage = { version = "0.1.0", path = "../../crates/storage" }
alh-tools = { version = "0.1.0", path = "../../crates/tools" }
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1.19"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }

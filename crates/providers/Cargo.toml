[package]
name = "alh-providers"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
alh-core = { version = "0.1.0", path = "../core" }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "rt-multi-thread", "sync", "net"] }

[dev-dependencies]
axum = "0.8.9"

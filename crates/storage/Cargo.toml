[package]
name = "alh-storage"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
alh-core = { version = "0.1.0", path = "../core" }
chrono = { version = "0.4.45", features = ["serde"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-uuid", "with-chrono", "with-json", "macros"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
uuid = { version = "1.29.1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
